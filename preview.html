<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>shuimo 的 MC 风格 GitHub 主页预览</title>
  <style>
    body{margin:0;padding:32px;background:#f6f4ec;color:#2f2a24;font-family:"Microsoft YaHei","PingFang SC",sans-serif}
    h1{font-size:20px;font-weight:500;margin:0 0 8px}
    p{font-size:13px;line-height:1.7;color:#6c6557;margin:0 0 24px}
    .section{margin-bottom:32px}
    .label{font-size:12px;color:#6c6557;margin-bottom:10px}
    .frame{display:inline-block;background:#fff;border:1px solid #ddd6c0;padding:12px}
    img{display:block;max-width:100%;height:auto}
    .desktop{width:800px}
    .mobile{width:420px}
    code{font-family:"Courier New",monospace;background:#ece8d8;padding:2px 6px}
  </style>
</head>
<body>
  <h1>Minecraft 风格主页预览</h1>
  <p>整页已合并为一张 MC 风格画布：装备栏、主线进度、语言背包、提交足迹、项目任务板与成就墙都在同一张图里。项目任务板按前端 / 后端 / AI 优先排列，粒子库已更新为 LangGraph 像素画智能体。桌面端使用 <code>assets/profile-mc.svg</code>，窄屏使用 <code>assets/profile-mc-mobile.svg</code>。</p>

  <div class="section">
    <div class="label">桌面端整页画布 · 800 × 800</div>
    <div class="frame"><img class="desktop" src="assets/profile-mc.svg" alt="桌面端主页横幅预览" /></div>
  </div>

  <div class="section">
    <div class="label">移动端整页画布 · 420 × 1360</div>
    <div class="frame"><img class="mobile" src="assets/profile-mc-mobile.svg" alt="移动端主页横幅预览" /></div>
  </div>
</body>
</html>
